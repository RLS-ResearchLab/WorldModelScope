run_name: decoder_dinov2
dino_wm:
  model:
    name: dino_wm
    image_size: 224
    action_dim: 7
    num_hist: 12
    encoder:
      type: dinov2
    predictor:
      dim: 384
      depth: 16
      heads: 6
      mlp_dim: 1536
dino_wm_checkpoint: null   # encoder is frozen/pretrained either way; set a path only if you need
                            # a trained feature_adapter's weights too (none exists today)

decoder:
  img_size: 224
  patch_size: 14    # grid = 16x16 = 256, matches DINOv2's native patch count
  decoder_dim: 384
  num_layers: 6
  num_heads: 6
  mlp_ratio: 4.0
  dropout: 0.0

data:
  name: bridge
  batch_size: 16
  num_workers: 4
  pin_memory: true
  train: {data_dir: raw/bridge_dataset/1.0.0, clip_len: 4, stride: 4, camera_key: image_0, source_fps: 5.0, target_fps: 4.0}
  val:   {data_dir: raw/bridge_dataset/1.0.0, clip_len: 4, stride: 4, camera_key: image_0, source_fps: 5.0, target_fps: 4.0}

optimizer: {name: adamw, lr: 3.0e-4, weight_decay: 0.05, betas: [0.9, 0.999]}
scheduler: {type: cosine, warmup_steps: 200, min_lr: 1.0e-6}

training:
  device: cuda
  precision: bf16
  max_steps: 8000
  steps_per_run: 8000
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  val_every: 500
  save_every: 500
  log_every: 50
  l1_weight: 0.1

resume_from: auto
checkpoint: {dir: checkpoints/decoder/dinov2}
logging: {output_dir: outputs/decoder/dinov2}
