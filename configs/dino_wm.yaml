run_name: full_data-run2

model:
  name: dino_wm
  image_size: 224              # was 256 -> shrinks P (patch count) roughly 30%
  action_dim: 7
  num_hist: 12               # your target -- now safe with the patches below
  loss_type: mse
  source_fps: 5.0
  target_fps: 4.0
  normalize_targets: false
  encoder_trainable: false
  encoder:
    type: dinov2
  feature_adapter:
    pool_size: 4            # NEW: 2x2 avg-pool on the patch grid -> P/4
  predictor:
    dim: 384
    depth: 16
    heads: 6
    mlp_dim: 1536
    dim_head: 64
    dropout: 0.0
    emb_dropout: 0.0
    use_checkpoint: true      # NEW: gradient checkpointing, ~1/depth activation memory
    sdpa_backend: efficient      # NEW: force the memory-efficient SDPA kernel

data:
  name: bridge
  batch_size: 1                # micro-batch -- this (not accumulation) sets peak memory
  num_workers: 0
  pin_memory: true
  train:
    data_dir: raw/bridge_dataset/1.0.0
    clip_len: 13               # can stay > num_hist+1 now; Trainer samples a random window
    stride: 8
    camera_key: image_0
    source_fps: 5.0
    target_fps: 4.0
  val:
    data_dir: raw/bridge_dataset/1.0.0
    clip_len: 128                # long clips are now GOOD -- more windows per clip, see Trainer.validate
    stride: 64
    camera_key: image_0
    source_fps: 5.0
    target_fps: 4.0

training:
  device: cuda
  precision: bf16
  grad_accumulation_steps: 32   # 1 (batch) x 32 (accum) = effective batch 32
  max_grad_norm: 1.0
  max_steps: 16000
  log_every: 50
  val_every: 2000
  save_every: 1000
  steps_per_run: 2000
  warmup_steps: 800

resume_from: auto
optimizer:
  name: adamw
  lr: 3e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
scheduler:
  type: cosine
  warmup_steps: 800
  min_lr: 1.0e-6
logging:
  backend: console
  output_dir: outputs/dino_wm/full_dataset

checkpoint:
  dir: checkpoints/dino_wm/full_dataset
 
