run_name: full_data_run1
model:
  name: dino_wm
  image_size: 256
  action_dim: 7
  num_hist: 3
  loss_type: mse
  # BridgeV2 sampling
  source_fps: 5.0
  target_fps: 4.0
  normalize_targets: false
  encoder_trainable: false
  encoder:
    type: dinov2

  predictor:
    dim: 384
    depth: 16
    heads: 6
    mlp_dim: 1536
    dim_head: 64
    dropout: 0.0
    emb_dropout: 0.0

data:
  name: bridge
  batch_size: 4
  num_workers: 0
  pin_memory: true

  params:
    data_dir: raw/bridge_dataset/1.0.0
    clip_len: 4
    stride: 4
    camera_key: image_0
    source_fps: 5.0
    target_fps: 4.0

training:
  
  device: cuda
  precision: bf16
  grad_accumulation_steps: 8   
  max_grad_norm: 1.0
  max_steps: 16000

 
  log_every: 50      
  val_every: 2000
  save_every: 1000

  warmup_steps: 800

resume_from: null  
optimizer:
  name: adamw
  lr: 3e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  type: cosine
  warmup_steps: 800  
  min_lr: 1.0e-6 

logging:
  backend: console
  output_dir: outputs/dino_wm/full_dataset
 
checkpoint:
  dir: checkpoints/dino_wm/full_dataset   