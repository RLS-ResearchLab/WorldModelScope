model:
  name: dino_wm
  image_size: 256
  action_dim: 7
  num_hist: 3
  loss_type: mse
  source_fps: 5.0
  target_fps: 4.0
  normalize_targets: false
  encoder_trainable: false

  encoder:
    type: eupe

  predictor:
    dim: 384
    depth: 16
    heads: 6
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.0
    emb_dropout: 0.0

data:
  name: bridge
  batch_size: 8
  num_workers: 0
  pin_memory: true

  params:
    data_dir: raw/bridge_dataset/subset_200_30
    clip_len: 4
    stride: 8
    camera_key: image_0
    source_fps: 5.0
    target_fps: 4.0

shuffle: true

training:
  epochs: 50
  device: cuda
  precision: bf16
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  val_every: 1
  save_every: 1
  log_every: 1
  warmup_steps: 1000
  steps_per_epoch: 250

optimizer:
  name: adamw
  lr: 3e-4
  weight_decay: 0.04
  betas: [0.9, 0.95]

scheduler:
  type: cosine
  warmup_steps: 1000

logging:
  backend: console
  log_every: 1
  output_dir: outputs/eupe_encoder

checkpoint:
  dir: checkpoints/eupe_encoder